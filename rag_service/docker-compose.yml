version: "3.9"

services:

  # ─── QDRANT ─────────────────────────────────────────────────
  # Векторная база данных — здесь хранятся все фрагменты сайта
  qdrant:
    image: qdrant/qdrant:latest
    container_name: caiu_qdrant
    ports:
      # Порт 6333 — основной API Qdrant
      - "6333:6333"
      - "6334:6334"
    volumes:
      # Сохраняем данные на диск чтобы не терялись при перезапуске
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # ─── REDIS ──────────────────────────────────────────────────
  # Очередь задач — нужен для Celery (добавим позже)
  redis:
    image: redis:7-alpine
    container_name: caiu_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

# ─── ХРАНИЛИЩЕ ДАННЫХ ─────────────────────────────────────────
volumes:
  qdrant_data:
    driver: local
  redis_data:
    driver: local
